# ros2_control controllers for the HUNTeR replica (used by gz_ros2_control in
# simulation and by controller_manager/ros2_control_node on hardware).
#
# Joint naming: {front,rear}_{left,right}_{steer,wheel}_joint.
# The passive suspension joints ({front,rear}_axle_heave_joint and
# {front,rear}_axle_roll_joint) are exported as state-only interfaces so the
# joint_state_broadcaster publishes them for robot_state_publisher.
controller_manager:
  ros__parameters:
    update_rate: 200  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    steering_position_controller:
      type: position_controllers/JointGroupPositionController

    wheel_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

    ptz_controller:
      type: position_controllers/JointGroupPositionController

    rws_controller:
      type: position_controllers/JointGroupPositionController

# gz_ros2_control turns position commands into joint velocity commands:
# v = -gain * (q - q_cmd) * update_rate, i.e. a 60 1/s P loop at 200 Hz (a stiffer
# loop keeps the knuckles on target against tyre aligning torque).
gz_ros_control:
  ros__parameters:
    position_proportional_gain: 0.3

joint_state_broadcaster:
  ros__parameters:
    use_local_topics: false

steering_position_controller:
  ros__parameters:
    joints:
      - front_left_steer_joint
      - front_right_steer_joint
      - rear_left_steer_joint
      - rear_right_steer_joint

wheel_velocity_controller:
  ros__parameters:
    joints:
      - front_left_wheel_joint
      - front_right_wheel_joint
      - rear_left_wheel_joint
      - rear_right_wheel_joint

# Optional: PTZ camera head (variant:=2020) and remote weapon station (payload:=rws).
ptz_controller:
  ros__parameters:
    joints: [ptz_pan_joint, ptz_tilt_joint]

rws_controller:
  ros__parameters:
    joints: [rws_yaw_joint, rws_pitch_joint]
